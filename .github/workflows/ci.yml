name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, windows-latest, windows-11-arm, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: fmt
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --check
      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: build
        run: cargo build --release
      # An unidentified process of the runner's user keeps every owned cache, and one that lists no
      # open files keeps every path no rule protects, so the log shows them.
      - name: process table and open files on this runner
        run: cargo run --release -p dustpan-sys --example process_table
      # M0-3 live lane 10: the release binary judges a real Windows profile. Windows cannot
      # list open files before M8, so a file no rule keeps is kept as unknown.
      - name: explain keeps Windows and Documents, and cannot call a file in Documents free
        if: runner.os == 'Windows'
        run: |
          documents="$USERPROFILE\\Documents"
          mkdir -p "$(cygpath -u "$documents")"
          echo lane-10 > "$(cygpath -u "$documents")/dustpan-lane-10.txt"
          out=$(./target/release/dustpan.exe explain 'C:\Windows' "$documents" "$documents\\dustpan-lane-10.txt")
          printf '%s\n' "$out"
          rm "$(cygpath -u "$documents")/dustpan-lane-10.txt"
          lines=()
          while IFS= read -r line; do lines+=("${line%$'\r'}"); done <<< "$out"
          [[ "${lines[0]}" == 'C:\Windows  Kept · critical system path' ]]
          [[ "${lines[1]}" == "$documents  Kept · home folder" ]]
          [[ "${lines[2]}" == "$documents\\dustpan-lane-10.txt  Kept · cannot tell whether a process has it open: this build cannot check it yet" ]]
      - name: explain keeps a path the Windows whitelist names
        if: runner.os == 'Windows'
        run: |
          keep="$USERPROFILE\\Projects\\keep"
          config="$APPDATA\\dustpan"
          mkdir -p "$(cygpath -u "$keep")" "$(cygpath -u "$config")"
          printf '%s\r\n' "$keep" '~\Projects\tilde' > "$(cygpath -u "$config")/whitelist"
          out=$(./target/release/dustpan.exe explain "$keep\\child" "$USERPROFILE\\Projects\\tilde\\child" "$USERPROFILE\\Projects\\keeper")
          printf '%s\n' "$out"
          rm "$(cygpath -u "$config")/whitelist"
          lines=()
          while IFS= read -r line; do lines+=("${line%$'\r'}"); done <<< "$out"
          [[ "${lines[0]}" == *'Kept · protected by your whitelist'*"$config\\whitelist"* ]]
          [[ "${lines[1]}" == *'Kept · protected by your whitelist'* ]]
          [[ "${lines[2]}" == "$USERPROFILE\\Projects\\keeper  Kept · cannot tell whether a process has it open: this build cannot check it yet" ]]
      - name: explain reads the whitelist from XDG_CONFIG_HOME
        if: runner.os == 'Linux'
        run: |
          home="$RUNNER_TEMP/m0-4-home"
          xdg="$RUNNER_TEMP/m0-4-xdg"
          bash tests/fixtures/mkhome.sh "$home"
          mkdir -p "$xdg/dustpan"
          printf '%s\n' '~/Projects/keep' > "$xdg/dustpan/whitelist"
          out=$(HOME="$home" XDG_CONFIG_HOME="$xdg" ./target/release/dustpan explain '~/Projects/keep/a')
          printf '%s\n' "$out"
          [[ "$out" == *"$xdg/dustpan/whitelist"* ]]
      - uses: actions/upload-artifact@v4
        with:
          name: dustpan-${{ matrix.os }}
          path: |
            target/release/dustpan
            target/release/dustpan.exe
          if-no-files-found: error

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: EmbarkStudios/cargo-deny-action@v2

  parity:
    name: parity (macos-latest)
    runs-on: macos-latest
    env:
      MOLE_VERSION: "1.67.0"
      MOLE_SHA256: "f263992189c33e54dba12081e3455b1f25078e4e9806e5d6a1df67f7fa552645"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - name: Install the pinned toolchain
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@v2
      - name: Install Mole from the pinned tag
        run: |
          dir=$(mktemp -d)
          curl -fsSL -o "$dir/mole.tgz" "https://github.com/tw93/Mole/archive/refs/tags/V${MOLE_VERSION}.tar.gz"
          echo "${MOLE_SHA256}  $dir/mole.tgz" | shasum -a 256 -c -
          tar -xzf "$dir/mole.tgz" -C "$dir"
          echo "PARITY_MO=$dir/Mole-${MOLE_VERSION}/mo" >> "$GITHUB_ENV"
      - name: Sandbox self-test, Mole version and HOME under the temp folder
        run: |
          out=$(scripts/parity.sh self-check)
          echo "$out"
          home=$(sed -n 's/^home=//p' <<<"$out")
          real=$(sed -n 's/^real-home=//p' <<<"$out")
          [[ "$(sed -n 's/^version=//p' <<<"$out")" == "$MOLE_VERSION" ]] || { echo "::error::Mole is not ${MOLE_VERSION}"; exit 1; }
          case "$home" in
            /private/var/folders/*|/private/tmp/*|/tmp/*) ;;
            *) echo "::error::the fixture HOME $home is not under the temp folder"; exit 1 ;;
          esac
          case "$home/" in
            "$real"/*) echo "::error::the fixture HOME $home is inside the real home $real"; exit 1 ;;
          esac
      - name: Unit tests
        run: cargo test -p dustpan-parity
      - name: Parity on the standard fixture
        run: |
          for c in clean purge installer; do
            echo "### scripts/parity.sh $c" | tee -a "$GITHUB_STEP_SUMMARY"
            scripts/parity.sh "$c" --save "$RUNNER_TEMP/mole-captures" | tee "$RUNNER_TEMP/parity-$c.txt" | tee -a "$GITHUB_STEP_SUMMARY"
            scripts/parity-check.sh "$c" "$RUNNER_TEMP/parity-$c.txt"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: mole-captures-${{ env.MOLE_VERSION }}
          path: ${{ runner.temp }}/mole-captures
          if-no-files-found: error
