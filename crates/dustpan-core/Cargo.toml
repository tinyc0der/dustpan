[package]
name = "dustpan-core"
description = "Domain types and pure logic for dustpan. No OS calls."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
caseless = "0.2"
unicode-normalization = "0.1"

[features]
# The in-memory `probe::fake::FakeProbe`. Only test targets turn it on (SAFE-17).
testkit = []

[dev-dependencies]
# Integration tests and the bench see the fake through this self-dependency.
dustpan-core = { path = ".", features = ["testkit"] }
# The guard bench measures the real probe on a real fixture tree, so the number includes the
# syscalls. Integration targets link the same core lib as sys, so `AbsPath` and the rest unify.
dustpan-sys.workspace = true

[[bench]]
name = "guard"
harness = false
