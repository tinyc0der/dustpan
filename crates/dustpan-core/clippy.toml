# A crate-level clippy.toml replaces the workspace one, so the four SAFE-01 bans are repeated here.
# The rest keep the crate boundary: dustpan-core makes no OS call. It asks through `probe::Probe`.
disallowed-methods = [
    { path = "std::fs::remove_file", reason = "SAFE-01: every removal goes through the sink module, the only place allowed to call this" },
    { path = "std::fs::remove_dir", reason = "SAFE-01: every removal goes through the sink module, the only place allowed to call this" },
    { path = "std::fs::remove_dir_all", reason = "SAFE-01: every removal goes through the sink module, the only place allowed to call this" },
    { path = "std::fs::rename", reason = "SAFE-01: every move goes through the sink module, the only place allowed to call this" },

    { path = "std::fs::canonicalize", reason = "dustpan-core makes no OS call: resolve links with probe::physical" },
    { path = "std::fs::copy", reason = "dustpan-core makes no OS call: file work belongs in dustpan-sys" },
    { path = "std::fs::create_dir", reason = "dustpan-core makes no OS call: file work belongs in dustpan-sys" },
    { path = "std::fs::create_dir_all", reason = "dustpan-core makes no OS call: file work belongs in dustpan-sys" },
    { path = "std::fs::exists", reason = "dustpan-core makes no OS call: ask Probe::node" },
    { path = "std::fs::hard_link", reason = "dustpan-core makes no OS call: file work belongs in dustpan-sys" },
    { path = "std::fs::metadata", reason = "dustpan-core makes no OS call: ask Probe::node" },
    { path = "std::fs::read", reason = "dustpan-core makes no OS call: take the bytes as an argument" },
    { path = "std::fs::read_dir", reason = "dustpan-core makes no OS call: the walker lives in dustpan-sys" },
    { path = "std::fs::read_link", reason = "dustpan-core makes no OS call: ask Probe::link_target" },
    { path = "std::fs::read_to_string", reason = "dustpan-core makes no OS call: take the text as an argument" },
    { path = "std::fs::set_permissions", reason = "dustpan-core makes no OS call: file work belongs in dustpan-sys" },
    { path = "std::fs::symlink_metadata", reason = "dustpan-core makes no OS call: ask Probe::node" },
    { path = "std::fs::write", reason = "dustpan-core makes no OS call: file work belongs in dustpan-sys" },
    { path = "std::fs::File::open", reason = "dustpan-core makes no OS call: file work belongs in dustpan-sys" },
    { path = "std::fs::File::create", reason = "dustpan-core makes no OS call: file work belongs in dustpan-sys" },
    { path = "std::fs::OpenOptions::open", reason = "dustpan-core makes no OS call: file work belongs in dustpan-sys" },
    { path = "std::path::Path::canonicalize", reason = "dustpan-core makes no OS call: resolve links with probe::physical" },
    { path = "std::path::Path::exists", reason = "dustpan-core makes no OS call: ask Probe::node" },
    { path = "std::path::Path::try_exists", reason = "dustpan-core makes no OS call: ask Probe::node" },
    { path = "std::path::Path::is_dir", reason = "dustpan-core makes no OS call: ask Probe::node" },
    { path = "std::path::Path::is_file", reason = "dustpan-core makes no OS call: ask Probe::node" },
    { path = "std::path::Path::is_symlink", reason = "dustpan-core makes no OS call: ask Probe::node" },
    { path = "std::path::Path::metadata", reason = "dustpan-core makes no OS call: ask Probe::node" },
    { path = "std::path::Path::symlink_metadata", reason = "dustpan-core makes no OS call: ask Probe::node" },
    { path = "std::path::Path::read_dir", reason = "dustpan-core makes no OS call: the walker lives in dustpan-sys" },
    { path = "std::path::Path::read_link", reason = "dustpan-core makes no OS call: ask Probe::link_target" },

    { path = "std::env::var", reason = "dustpan-core makes no OS call: take the lookup as a paths::Env argument" },
    { path = "std::env::var_os", reason = "dustpan-core makes no OS call: take the lookup as a paths::Env argument" },
    { path = "std::env::vars", reason = "dustpan-core makes no OS call: take the lookup as a paths::Env argument" },
    { path = "std::env::vars_os", reason = "dustpan-core makes no OS call: take the lookup as a paths::Env argument" },
    { path = "std::env::current_dir", reason = "dustpan-core makes no OS call: the binary resolves relative paths" },
    { path = "std::env::current_exe", reason = "dustpan-core makes no OS call: take the path as an argument" },
    { path = "std::process::Command::new", reason = "dustpan-core makes no OS call: subprocesses belong in dustpan-sys" },
    { path = "std::time::SystemTime::now", reason = "dustpan-core makes no OS call: take the time as an argument" },
]
