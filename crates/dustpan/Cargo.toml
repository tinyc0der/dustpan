[package]
name = "dustpan"
description = "A disk cleaner with a terminal UI and a scriptable CLI."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
repository.workspace = true

[dependencies]
dustpan-core.workspace = true
dustpan-sys.workspace = true
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
tempfile = "3"
